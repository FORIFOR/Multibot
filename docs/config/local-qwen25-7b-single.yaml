schema_version: 1
profile_name: local-qwen25-7b-single
defaults:
  connection_id: ollama
  model: agentteam-qwen25-7b-16k
  language: ja
  timezone: Asia/Tokyo
  team_mode: single
  require_independent_review: false
connections:
- id: ollama
  driver: ollama
  base_url: http://127.0.0.1:11434/v1
  capability_check: not_run
  refusal_fallback: false
  allowed_fallback_connections: []
limits:
  max_active_workers: 1
  max_tasks: 1
  max_peer_messages_per_task: 1
  max_revision_rounds: 1
  max_model_calls: 120
  max_tool_calls: 200
  timeout_seconds: 600
  budget_usd: 6.0
  max_output_tokens: 8000
  max_tool_output_chars: 12000
  max_session_cost_usd: 6.0
  max_session_turns: 120
  max_replans: 0
policy:
  external_mutation: approval
  skill_install: approval
  telemetry: 'off'
  share_replay: 'off'
  fallback: explicitly_approved_only
agents:
- id: master
  role: master
  enabled: false
  connection_id: inherit
  model: inherit
  system_prompt_file: prompts/master.md
  prompt_mode: auto_seed
  skill_ids:
  - artifact-handoff
  tools:
  - create_task
  - update_task
  - send_message
  - read_messages
  - read_artifact
  - list_artifacts
  - workspace_read
  - workspace_write
  - publish_artifact
  - request_approval
  - report_blocker
- id: researcher
  role: researcher
  enabled: false
  connection_id: inherit
  model: inherit
  system_prompt_file: prompts/researcher.md
  prompt_mode: auto_seed
  skill_ids:
  - source-grounded-research
  - artifact-handoff
  tools:
  - web_search
  - web_fetch
  - send_message
  - read_messages
  - read_artifact
  - list_artifacts
  - workspace_read
  - workspace_write
  - publish_artifact
  - report_blocker
- id: builder
  role: builder
  enabled: true
  connection_id: inherit
  model: inherit
  system_prompt_file: prompts/builder.md
  prompt_mode: auto_seed
  skill_ids:
  - source-grounded-research
  - artifact-handoff
  tools:
  - web_search
  - web_fetch
  - workspace_read
  - workspace_write
  - workspace_list
  - sandbox_run
  - run_check
  - read_artifact
  - list_artifacts
  - publish_artifact
  - report_blocker
- id: reviewer
  role: reviewer
  enabled: false
  connection_id: inherit
  model: inherit
  system_prompt_file: prompts/reviewer.md
  prompt_mode: auto_seed
  skill_ids:
  - evidence-review
  - artifact-handoff
  tools:
  - read_artifact
  - list_artifacts
  - run_check
  - sandbox_run
  - web_fetch
  - workspace_read
  - workspace_write
  - send_message
  - read_messages
  - publish_artifact
  - submit_review
  - report_blocker
- id: reporter
  role: reporter
  enabled: false
  connection_id: inherit
  model: inherit
  system_prompt_file: prompts/reporter.md
  prompt_mode: auto_seed
  skill_ids: []
  tools:
  - read_artifact
  - list_artifacts
  - read_events
  - publish_artifact
pricing: {}
