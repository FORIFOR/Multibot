[project]
name = "agentteam"
version = "0.2.0"
description = "An open-source AI team that ships real work, with a conversation you can follow."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.5.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
  "jsonschema>=4.22",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "sse-starlette>=2",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
agentteam = "agentteam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentteam"]
artifacts = ["agentteam/ui/**"]

[tool.hatch.build]
include = ["agentteam/**", "prompts/**", "skills/**", "schemas/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
