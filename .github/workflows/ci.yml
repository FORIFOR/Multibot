name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -e '.[dev]' pytest-timeout
        working-directory: backend
      - run: .venv/bin/python -m pytest -q --timeout 120
        working-directory: backend
        env:
          AGENTTEAM_NO_SEATBELT: "1"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
