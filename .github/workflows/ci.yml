name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: audit the complete pinned runtime set against current advisories
        run: uvx --python 3.12 pip-audit==2.10.1 --disable-pip --require-hashes --strict -r backend/requirements.lock --format json --output /tmp/runtime-audit.json
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: audit frontend production dependencies
        run: pnpm audit --prod --json > /tmp/frontend-audit.json
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-advisory-evidence
          path: |
            /tmp/runtime-audit.json
            /tmp/frontend-audit.json
          if-no-files-found: ignore
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv backend/.venv --python 3.12 && uv pip install --python backend/.venv/bin/python -r backend/requirements.lock -e 'backend[dev]'
      - run: backend/.venv/bin/ruff check backend/agentteam backend/scripts/check_public_service.py backend/scripts/check_subject_admission.py backend/scripts/check_public_responses.py backend/scripts/public_service_workflow.py backend/scripts/provision_public_oidc.py backend/scripts/check_message_handoff.py backend/scripts/verify_public_service_exports.py backend/scripts/check_document_report.py
      - name: Verify report boundary with preserved actual-source runs
        run: backend/.venv/bin/python backend/scripts/check_document_report.py --source docs/evidence/real-readiness-v62-qwen35-fixed-20261002 --root /tmp/multibot-document-report-replay
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile && pnpm build && pnpm lint
        working-directory: frontend
      - name: Committed UI bundle matches source
        run: diff -r frontend/dist backend/agentteam/ui
  public-service:
    # Actual issued credentials, repository documents, HTTP, SQLite and Chrome.
    # Saved capability evidence is a prerequisite record only; no LLM executes.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv backend/.venv --python 3.12 && uv pip install --python backend/.venv/bin/python -r backend/requirements.lock -e backend
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
      - name: Install browser verification dependencies with bounded downloads
        timeout-minutes: 4
        run: |
          # The runner mirror exceeded setup deadlines on the 61 MB CJK font package.
          # Use Ubuntu's archive; APT's signed indexes and package hashes still apply.
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y sqlite3 fonts-noto-cjk fonts-noto-color-emoji
      - name: Validate exact bundled UI before browser checks
        run: diff -r frontend/dist backend/agentteam/ui
      - name: Verify actual service boundaries without model execution
        run: backend/.venv/bin/python backend/scripts/check_public_service.py --root /tmp/multibot-public-service
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-service-evidence
          retention-days: 7
          # Never upload credentials, databases, configuration, or private logs.
          path: |
            /tmp/multibot-public-service/report.json
            /tmp/multibot-public-service/admission/verification.json
            /tmp/multibot-public-service/responses/response-check.json
            /tmp/multibot-public-service/browser/results.json
            /tmp/multibot-public-service/browser/retry-reload.json
            /tmp/multibot-public-service/browser/parallel-login.json
            /tmp/multibot-public-service/browser/next-principal-empty.png
          if-no-files-found: ignore
