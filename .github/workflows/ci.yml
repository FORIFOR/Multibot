name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: audit the complete pinned runtime set against current advisories
        run: uvx --python 3.12 pip-audit==2.10.1 --disable-pip --require-hashes --strict -r backend/requirements.lock --format json --output /tmp/runtime-audit.json
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: audit frontend production dependencies
        run: pnpm audit --prod --json > /tmp/frontend-audit.json
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-advisory-evidence
          path: |
            /tmp/runtime-audit.json
            /tmp/frontend-audit.json
          if-no-files-found: ignore
  oidc-integration:
    # Real local Keycloak, OAuth2 Proxy, code-flow browser logins and API checks.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv backend/.venv --python 3.12 && uv pip install --python backend/.venv/bin/python -r backend/requirements.lock -e backend
      - run: backend/.venv/bin/python backend/scripts/provision_oidc_staging.py --root /tmp/agentteam-oidc
      - name: start isolated development IdP
        run: |
          # Linux root without DAC_OVERRIDE cannot read a runner-owned 0600
          # import. Transfer only this disposable private import to its UID.
          sudo chown -R 0:0 /tmp/agentteam-oidc/keycloak-import
          docker run -d --name agentteam-oidc-keycloak --user 0:0 --cap-drop ALL --security-opt no-new-privileges --memory 1g --pids-limit 256 --env-file /tmp/agentteam-oidc/keycloak.env -e JAVA_OPTS_KC_HEAP='-Xms128m -Xmx512m' -p 127.0.0.1:8801:8080 -v /tmp/agentteam-oidc/keycloak-import:/opt/keycloak/data/import:ro quay.io/keycloak/keycloak@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54 start-dev --hostname http://127.0.0.1:8801 --import-realm
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8801/realms/agentteam/.well-known/openid-configuration > /dev/null && break; sleep 1; done
          if ! curl -sf http://127.0.0.1:8801/realms/agentteam/.well-known/openid-configuration > /dev/null; then
            docker inspect agentteam-oidc-keycloak --format '{{json .State}}'
            docker logs --tail 40 agentteam-oidc-keycloak
            exit 1
          fi
      - name: download and verify OAuth2 Proxy
        run: |
          curl -fsSL -o /tmp/oauth2-proxy.tar.gz https://github.com/oauth2-proxy/oauth2-proxy/releases/download/v7.15.4/oauth2-proxy-v7.15.4.linux-amd64.tar.gz
          curl -fsSL -o /tmp/oauth2-proxy.sha256 https://github.com/oauth2-proxy/oauth2-proxy/releases/download/v7.15.4/oauth2-proxy-v7.15.4.linux-amd64.tar.gz-sha256sum.txt
          python3 - <<'PY'
          import hashlib, pathlib
          assert hashlib.sha256(pathlib.Path('/tmp/oauth2-proxy.tar.gz').read_bytes()).hexdigest() == pathlib.Path('/tmp/oauth2-proxy.sha256').read_text().split()[0]
          PY
          tar xzf /tmp/oauth2-proxy.tar.gz -C /tmp
      - name: start secured API and proxy
        run: |
          AGENTTEAM_MODE=production AGENTTEAM_ACCESS_FILE=/tmp/agentteam-oidc/security/access.json nohup backend/.venv/bin/agentteam serve --port 8798 --data-dir /tmp/agentteam-oidc/data > /tmp/agentteam-oidc/server.log 2>&1 &
          echo $! > /tmp/agentteam-oidc/server.pid
          nohup /tmp/oauth2-proxy-v7.15.4.linux-amd64/oauth2-proxy --config /tmp/agentteam-oidc/oauth2-proxy.cfg > /tmp/agentteam-oidc/proxy-sanitized.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8800/ping > /dev/null && break; sleep 1; done
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile && node scripts/oidc-smoke.mjs
        working-directory: frontend
        env:
          OIDC_ROOT: /tmp/agentteam-oidc
      - name: verify restored SSO sessions and actual identity outage
        run: |
          kill -TERM "$(cat /tmp/agentteam-oidc/server.pid)"
          for i in $(seq 1 30); do kill -0 "$(cat /tmp/agentteam-oidc/server.pid)" 2>/dev/null || break; sleep 1; done
          backend/.venv/bin/python backend/scripts/check_oidc_restore.py --root /tmp/agentteam-oidc
          docker stop -t 30 agentteam-oidc-keycloak
          backend/.venv/bin/python backend/scripts/check_oidc_restore.py --root /tmp/agentteam-oidc --check-outage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oidc-integration-evidence
          path: |
            /tmp/agentteam-oidc/oidc-smoke.json
            /tmp/agentteam-oidc/oidc-failure-*.json
            /tmp/agentteam-oidc/oidc-restore.json
            /tmp/agentteam-oidc/oidc-outage.json
            /tmp/agentteam-oidc/screenshots
          if-no-files-found: ignore
      - if: always()
        run: docker stop -t 30 agentteam-oidc-keycloak
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -e '.[dev]' pytest-timeout
        working-directory: backend
      - run: docker pull python:3.12-slim  # sandbox image, so the Docker isolation test runs on the runner
      - name: install verified age for actual encrypted restore drill
        run: |
          curl -fsSL -o /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  /tmp/age.tar.gz' | sha256sum -c -
          tar xzf /tmp/age.tar.gz -C /tmp
      - run: .venv/bin/python -m pytest -q --timeout 180
        working-directory: backend
        env:
          AGENTTEAM_NO_SEATBELT: "1"
          AGENTTEAM_AGE_BIN: /tmp/age/age
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
  ui-smoke:
    # Drives the bundled UI (backend/agentteam/ui) end to end with the scripted test provider in headless Chrome, JA and EN.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -e '.[dev]'
        working-directory: backend
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: start the fake-provider demo server
        run: |
          AGENTTEAM_ALLOW_FAKE_PROVIDER=1 AGENTTEAM_NO_SEATBELT=1 nohup .venv/bin/python scripts/demo_fake_server.py --port 8791 > /tmp/demo.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8791/api/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8791/api/health
        working-directory: backend
      - run: LANG_UI=ja SHOTS=/tmp/agentteam-shots node scripts/ui-smoke.mjs
        working-directory: frontend
      - run: LANG_UI=en SHOTS=/tmp/agentteam-shots node scripts/ui-smoke.mjs
        working-directory: frontend
      - name: Automated accessibility scan (axe, WCAG 2.x A/AA) of the everyday screens
        run: node scripts/a11y-smoke.mjs
        working-directory: frontend
      - if: always()
        run: cat /tmp/demo.log | tail -20
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ui-smoke-screenshots, path: /tmp/agentteam-shots, if-no-files-found: ignore }
  secured-container:
    # Real credentials, HTTP, SQLite, and browser. Replays a saved real-model run; no fake provider.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv backend/.venv --python 3.12 && uv pip install --python backend/.venv/bin/python -r backend/requirements.lock -e backend
      - run: backend/.venv/bin/python backend/scripts/provision_secure_smoke.py --root /tmp/agentteam-secured-check
      - run: docker build -t agentteam:secured .
      - name: start secured container
        run: |
          docker run -d --name agentteam-secured-check --user "$(id -u):$(id -g)" --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g --tmpfs /tmp:rw,noexec,nosuid,size=64m -p 127.0.0.1:8796:8787 -v /tmp/agentteam-secured-check/data:/data -v /tmp/agentteam-secured-check/security:/run/secrets:ro agentteam:secured
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8796/api/health/live && break; sleep 1; done
          curl -sf http://127.0.0.1:8796/api/health/live
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: node scripts/production-auth-smoke.mjs
        working-directory: frontend
        env:
          BASE: http://127.0.0.1:8796
          ADMIN_KEY_FILE: /tmp/agentteam-secured-check/forifor.key
          OPERATOR_KEY_FILE: /tmp/agentteam-secured-check/verification-operator.key
          AUDITOR_KEY_FILE: /tmp/agentteam-secured-check/verification-auditor.key
          SHOTS: /tmp/agentteam-secured-check/screenshots
          RUN_ID: run_1a09bfe4acdc8c36d5f
      - run: backend/.venv/bin/python backend/scripts/check_secure_server.py --root /tmp/agentteam-secured-check
      - if: always()
        run: docker logs agentteam-secured-check && docker stop -t 30 agentteam-secured-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secured-container-evidence
          path: |
            /tmp/agentteam-secured-check/screenshots
            /tmp/agentteam-secured-check/http-smoke.json
          if-no-files-found: ignore
