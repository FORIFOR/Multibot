name: current-ui
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/current-ui.yml'
permissions:
  contents: read
concurrency:
  group: current-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  current-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build current frontend source (never the checked-in bundle)
        run: pnpm build && pnpm test:bots && pnpm test:router && pnpm test:journey && pnpm test:welcome && pnpm test:markdown && pnpm test:delivery
        working-directory: frontend
      - name: Install Japanese and emoji fonts for meaningful layout and screenshot checks
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: Install WebKit for Safari-engine coverage
        if: matrix.browser == 'webkit'
        run: node node_modules/playwright-core/cli.js install --with-deps webkit
        working-directory: frontend
      - name: Current UI browser regressions (explicit API fixtures)
        run: node scripts/ui-polish-smoke.mjs && node scripts/three-step-smoke.mjs
        working-directory: frontend
        env:
          BROWSER: ${{ matrix.browser }}
          SHOTS: /tmp/agentteam-polish-shots
      - name: Record the exact tested commit
        if: always()
        run: |
          mkdir -p /tmp/agentteam-polish-shots
          git rev-parse HEAD > /tmp/agentteam-polish-shots/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-ui-${{ matrix.browser }}
          retention-days: 7
          path: /tmp/agentteam-polish-shots
