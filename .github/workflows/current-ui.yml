name: current-ui
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/current-ui.yml'
permissions:
  contents: read
concurrency:
  group: current-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  current-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Capture exact source and installed frontend dependencies for reproduction
        run: |
          git rev-parse HEAD > /tmp/source-commit.txt
          tar -czf /tmp/ui-reproducer.tar.gz frontend backend
      - name: Build current frontend source (never the checked-in bundle)
        run: pnpm build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-ui-reproducer
          retention-days: 2
          path: |
            /tmp/source-commit.txt
            /tmp/ui-reproducer.tar.gz
